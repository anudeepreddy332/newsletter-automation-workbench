services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: newsletter_integration
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - integration_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d newsletter_integration"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  integration_postgres_data:
